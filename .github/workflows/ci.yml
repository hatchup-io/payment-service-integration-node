name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Lint + typecheck + test
    # Never run a fork's pull request on our own runner: that is arbitrary code
    # on our machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # Node bare, then pnpm, then Node again for the cache: the self-hosted
      # runner has no Node of its own, pnpm/action-setup@v6 needs one, and
      # setup-node's `cache: pnpm` needs pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # Into the job's temp dir: the runners on a host share one home, and
      # concurrent jobs clobber the default ~/setup-pnpm.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify dist artifacts
        run: |
          test -f dist/index.js  || (echo "::error::missing dist/index.js (ESM)" && exit 1)
          test -f dist/index.cjs || (echo "::error::missing dist/index.cjs (CJS)" && exit 1)
          test -f dist/index.d.ts  || (echo "::error::missing dist/index.d.ts (ESM types)" && exit 1)
          test -f dist/index.d.cts || (echo "::error::missing dist/index.d.cts (CJS types)" && exit 1)
